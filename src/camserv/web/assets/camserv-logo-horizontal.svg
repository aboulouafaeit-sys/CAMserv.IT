<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="hzCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="shieldGradHz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Left Emblem Group (scaled & positioned at x=20, y=10) -->
  <g transform="translate(15, 10) scale(0.35)">
    <!-- Shield -->
    <path d="M 256,36 L 416,104 C 416,280 340,396 256,464 C 172,396 96,280 96,104 Z"
          fill="url(#shieldGradHz)" stroke="url(#hzCyan)" stroke-width="8" stroke-linejoin="round"/>
    <!-- Wings -->
    <path d="M 256,120 L 140,164 C 146,244 190,320 256,360 Z" fill="#0F172A" stroke="url(#hzCyan)" stroke-width="5"/>
    <path d="M 256,120 L 372,164 C 366,244 322,320 256,360 Z" fill="#0F172A" stroke="url(#hzCyan)" stroke-width="5"/>
    <!-- Iris -->
    <circle cx="256" cy="226" r="62" fill="#020617" stroke="url(#hzCyan)" stroke-width="6"/>
    <circle cx="256" cy="226" r="20" fill="url(#hzCyan)"/>
    <!-- Circuit lines -->
    <path d="M 256,360 L 256,416" stroke="#00E5FF" stroke-width="4" stroke-linecap="round"/>
    <circle cx="256" cy="416" r="7" fill="#00E5FF"/>
    <path d="M 216,346 L 194,374 L 168,374" stroke="#38BDF8" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="168" cy="374" r="6" fill="#38BDF8"/>
    <path d="M 296,346 L 318,374 L 344,374" stroke="#38BDF8" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="344" cy="374" r="6" fill="#38BDF8"/>
  </g>

  <!-- Typography: Wordmark -->
  <!-- "CAM" in pure white bold -->
  <text x="210" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif"
        font-size="78" font-weight="900" fill="#FFFFFF" letter-spacing="1">CAM</text>

  <!-- "serv" in electric cyan bold -->
  <text x="390" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif"
        font-size="78" font-weight="900" fill="url(#hzCyan)" letter-spacing="1">serv</text>

  <!-- Divider & Subtitle -->
  <line x1="212" y1="130" x2="740" y2="130" stroke="#1E293B" stroke-width="2"/>
  <circle cx="212" cy="130" r="3" fill="#00E5FF"/>
  <circle cx="740" cy="130" r="3" fill="#3B82F6"/>

  <text x="212" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif"
        font-size="16" font-weight="700" fill="#94A3B8" letter-spacing="6">SECURITY INTELLIGENCE PLATFORM</text>
</svg>
