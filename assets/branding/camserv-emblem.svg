<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0A0F1D" stop-opacity="0"/>
    </radialGradient>

    <!-- Shield Primary Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Chrome Edge Gradient -->
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="230" fill="url(#bgGlow)"/>

  <!-- Outer Defensive Shield Boundary -->
  <path d="M 256,36 L 416,104 C 416,280 340,396 256,464 C 172,396 96,280 96,104 Z"
        fill="url(#shieldGrad)" stroke="url(#edgeGrad)" stroke-width="6" stroke-linejoin="round"/>

  <!-- Inner Technical Contour -->
  <path d="M 256,58 L 396,118 C 396,270 330,374 256,436 C 182,374 116,270 116,118 Z"
        fill="none" stroke="#1E293B" stroke-width="2.5" stroke-dasharray="8 6"/>

  <!-- Cybernetic Falcon Wings (Left) -->
  <path d="M 256,120 L 140,164 C 146,244 190,320 256,360 Z"
        fill="#0F172A" stroke="url(#cyanGrad)" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M 256,160 L 164,196 C 170,250 204,304 256,334 Z"
        fill="#1E293B" opacity="0.6"/>
  <path d="M 256,200 L 190,226 C 196,260 220,296 256,312 Z"
        fill="#020617" opacity="0.8"/>

  <!-- Cybernetic Falcon Wings (Right) -->
  <path d="M 256,120 L 372,164 C 366,244 322,320 256,360 Z"
        fill="#0F172A" stroke="url(#cyanGrad)" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M 256,160 L 348,196 C 342,250 308,304 256,334 Z"
        fill="#1E293B" opacity="0.6"/>
  <path d="M 256,200 L 322,226 C 316,260 292,296 256,312 Z"
        fill="#020617" opacity="0.8"/>

  <!-- Optical Aperture Iris Ring (Center) -->
  <circle cx="256" cy="226" r="62" fill="#020617" stroke="url(#cyanGrad)" stroke-width="5" filter="url(#neonGlow)"/>
  <circle cx="256" cy="226" r="48" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="14 8"/>

  <!-- Aperture Iris Blades -->
  <path d="M 256,178 L 272,210 L 256,226 Z" fill="#00E5FF" opacity="0.85"/>
  <path d="M 298,206 L 286,238 L 268,228 Z" fill="#00E5FF" opacity="0.85"/>
  <path d="M 302,246 L 270,256 L 264,236 Z" fill="#00E5FF" opacity="0.85"/>
  <path d="M 266,274 L 244,250 L 254,232 Z" fill="#00E5FF" opacity="0.85"/>
  <path d="M 218,252 L 232,222 L 248,234 Z" fill="#00E5FF" opacity="0.85"/>
  <path d="M 212,210 L 242,204 L 246,222 Z" fill="#00E5FF" opacity="0.85"/>

  <!-- Focal Core (Optical Lens Sensor) -->
  <circle cx="256" cy="226" r="18" fill="url(#cyanGrad)"/>
  <circle cx="252" cy="222" r="5" fill="#FFFFFF" opacity="0.9"/>

  <!-- Kinematic Targeting Reticle Crosshairs -->
  <line x1="256" y1="148" x2="256" y2="162" stroke="#00E5FF" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="290" x2="256" y2="304" stroke="#00E5FF" stroke-width="3" stroke-linecap="round"/>
  <line x1="178" y1="226" x2="192" y2="226" stroke="#00E5FF" stroke-width="3" stroke-linecap="round"/>
  <line x1="320" y1="226" x2="334" y2="226" stroke="#00E5FF" stroke-width="3" stroke-linecap="round"/>

  <!-- Neural Circuit Traces & Nodes (GDPR Shield Base) -->
  <path d="M 256,360 L 256,416" stroke="#00E5FF" stroke-width="3" stroke-linecap="round"/>
  <circle cx="256" cy="416" r="5" fill="#00E5FF"/>
  <path d="M 216,346 L 194,374 L 168,374" stroke="#38BDF8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="168" cy="374" r="4.5" fill="#38BDF8"/>
  <path d="M 296,346 L 318,374 L 344,374" stroke="#38BDF8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="344" cy="374" r="4.5" fill="#38BDF8"/>
</svg>
