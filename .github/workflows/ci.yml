name: CAMserv Platform Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[testing]"

      - name: Execute Automated Test Suite (115 Tests)
        env:
          PYTHONPATH: src
        run: |
          python -m pytest tests/ -v

      - name: Run CLI Hardware Diagnostics Probe
        env:
          PYTHONPATH: src
        run: |
          python -m camserv.main detect-hw

      - name: Run Forensic Audit Chain Verification
        env:
          PYTHONPATH: src
        run: |
          python -m camserv.main audit-verify
